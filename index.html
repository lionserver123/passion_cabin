<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f3eb">
<meta name="description" content="溫柔手帳風的熱情管理小屋，記錄你的探索、深耕與收藏。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">

<title>熱情管理小屋</title>
<style>
:root{--bg:#f7f3eb;--paper:#fffdf8;--ink:#3f4940;--muted:#7e877c;--line:#e7e1d5;--sage:#dce7d9;--sage-deep:#607b63;--blue:#e4eaf2;--lav:#eee5f1;--sand:#f2e5d2;--rose:#f3e2dd;--shadow:0 8px 26px rgba(75,77,61,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.55}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:10px 14px;background:var(--sage-deep);color:white;font-weight:650;transition:.15s}button:hover{filter:brightness(.96);transform:translateY(-1px)}button.secondary{background:#eee9df;color:var(--ink)}button.ghost{background:transparent;color:var(--sage-deep);border:1px solid var(--line)}button.danger{background:#f3e2dd;color:#8a5148}button.small{padding:6px 10px;font-size:.88rem}
header{max-width:1120px;margin:auto;padding:28px 22px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.brand-icon{width:48px;height:48px;border-radius:17px;background:var(--sage);display:grid;place-items:center;font-size:25px}.brand h1{font-size:1.45rem;margin:0;letter-spacing:.03em}.brand p{margin:2px 0 0;color:var(--muted);font-size:.9rem}.header-actions{display:flex;gap:8px;flex-wrap:wrap}
main{max-width:1120px;margin:auto;padding:12px 22px 48px}.welcome{background:linear-gradient(120deg,#e8eee3,#f4e9db);border:1px solid #e4e5d9;border-radius:24px;padding:23px 25px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:20px}.welcome h2{margin:0 0 5px;font-size:1.35rem}.welcome p{margin:0;color:#687366}.welcome .doodle{font-size:44px;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 24px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px 16px;box-shadow:var(--shadow)}.stat .num{font-size:1.8rem;font-weight:750;line-height:1.2}.stat .label{font-size:.88rem;color:var(--muted);margin-top:5px}
.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px;margin-bottom:4px}.tab{white-space:nowrap;background:transparent;color:var(--muted);border:1px solid transparent}.tab.active{background:var(--paper);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.panel{display:none}.panel.active{display:block}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 15px;flex-wrap:wrap}.section-head h2{margin:0;font-size:1.22rem}.section-head p{margin:3px 0 0;color:var(--muted);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.interest-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:210px}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.interest-card h3{margin:0;font-size:1.08rem;overflow-wrap:anywhere}.emoji{font-size:1.5rem}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:.78rem;background:#eee9df;color:#655f52;white-space:nowrap}.pill.deep{background:var(--sage);color:#48664b}.pill.explore{background:var(--blue);color:#50657f}.pill.collect{background:var(--lav);color:#795c86}.pill.paused{background:var(--sand);color:#8b6b3e}.pill.done{background:#e4eee7;color:#4f7658}.muted{color:var(--muted);font-size:.9rem}.card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:5px}
.empty{border:1px dashed #d6d0c4;border-radius:20px;padding:32px 18px;text-align:center;color:var(--muted);background:rgba(255,253,248,.55)}.empty .big{font-size:2rem;margin-bottom:8px}
.search-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.search-row input{flex:1;min-width:190px}
input,textarea,select{width:100%;background:#fffefa;border:1px solid #ded8cc;border-radius:12px;padding:11px 12px;color:var(--ink);outline:none}input:focus,textarea:focus,select:focus{border-color:#8fa78d;box-shadow:0 0 0 3px #dce7d955}textarea{resize:vertical;min-height:78px}label{display:block;font-size:.9rem;font-weight:650;margin-bottom:6px}.field{margin-bottom:14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:820px;box-shadow:var(--shadow)}.form-card h3{margin:0 0 4px}.form-card .intro{margin:0 0 18px;color:var(--muted);font-size:.92rem}.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px}
.history-list{display:flex;flex-direction:column;gap:10px}.history-item{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}.history-dot{width:36px;height:36px;flex:0 0 36px;border-radius:12px;background:var(--sage);display:grid;place-items:center}.history-item h4{margin:0 0 3px}.history-item p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.history-date{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.note{padding:13px 15px;border-radius:14px;background:#f1eadf;color:#6d665a;font-size:.9rem;margin-top:16px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#3f4940;color:white;border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);z-index:10;display:none;max-width:90vw}.toast.show{display:block}
footer{max-width:1120px;margin:auto;padding:0 22px 28px;text-align:center;color:var(--muted);font-size:.84rem}
dialog{border:1px solid var(--line);border-radius:22px;padding:0;width:min(620px,calc(100% - 28px));max-height:88vh;background:var(--paper);color:var(--ink);box-shadow:0 20px 70px #3f494033}dialog::backdrop{background:#28302866;backdrop-filter:blur(3px)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.modal-body{padding:20px;overflow:auto}.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:0 20px 20px;flex-wrap:wrap}
@media(max-width:760px){header{padding-top:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.welcome{padding:18px}.welcome .doodle{font-size:34px}.form-grid{grid-template-columns:1fr}.header-actions button{padding:9px 11px}.section-head{align-items:flex-start}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="brand-icon">🌱</div><div><h1>熱情管理小屋</h1><p>給好奇心一個柔軟的家</p></div></div>
  <div class="header-actions">
    <button class="ghost" id="exportBtn">↗ 匯出備份</button>
    <button class="secondary" id="importBtn">↙ 匯入備份</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</header>
<main>
  <section class="welcome">
    <div><h2>你可以熱情，也可以改變心意。☁️</h2><p>這裡不是催促你完成所有事情的地方，而是陪你看見自己正在探索什麼。</p></div><div class="doodle">✿</div>
  </section>
  <section class="stats" id="stats"></section>
  <nav class="tabs" aria-label="主要功能">
    <button class="tab active" data-tab="home">我的熱情地圖</button>
    <button class="tab" data-tab="new">＋ 熱情決策卡</button>
    <button class="tab" data-tab="history">探索紀錄</button>
  </nav>
  <section class="panel active" id="panel-home">
    <div class="section-head"><div><h2>我的興趣花園</h2><p>每一份興趣，都可以有自己的節奏。</p></div><button id="newBtn">＋ 記下一個新興趣</button></div>
    <div class="search-row"><input id="search" placeholder="搜尋興趣、想法或紀錄…"><select id="filter" style="max-width:170px"><option value="all">全部分類</option><option value="深耕區">深耕區</option><option value="探索區">探索區</option><option value="收藏區">收藏區</option><option value="已暫停">已暫停</option><option value="已完成">已完成</option></select></div>
    <div id="interestGrid" class="grid"></div>
    <div class="note">🌿 小提醒：興趣不需要全部變成目標。你可以先體驗、暫停，或在完成一個階段後安心休息。</div>
  </section>
  <section class="panel" id="panel-new">
    <div class="section-head"><div><h2 id="formTitle">熱情決策卡</h2><p>先把想法放下來，不需要現在就做出永久承諾。</p></div></div>
    <form class="form-card" id="interestForm">
      <input type="hidden" id="editId">
      <div class="field"><label for="name">我想嘗試／正在做的事情 *</label><input id="name" required maxlength="100" placeholder="例如：皮拉提斯、肌理畫、學習攝影"></div>
      <div class="form-grid">
        <div class="field"><label for="category">目前放在哪個區域</label><select id="category"><option>探索區</option><option>深耕區</option><option>收藏區</option></select></div>
        <div class="field"><label for="emoji">小圖示（可選）</label><select id="emoji"><option>🌱</option><option>🎨</option><option>💃</option><option>📷</option><option>🏋️</option><option>🧘</option><option>📚</option><option>✈️</option><option>🎵</option><option>✨</option></select></div>
      </div>
      <div class="field"><label for="appeal">吸引我的地方｜我真正想得到什麼？</label><textarea id="appeal" placeholder="我最期待的是……"></textarea></div>
      <div class="field"><label for="doubts">目前的疑慮｜哪些事情還不確定？</label><textarea id="doubts" placeholder="我還想確認……"></textarea></div>
      <div class="form-grid">
        <div class="field"><label for="cost">我願意付出的代價</label><textarea id="cost" placeholder="時間、金錢、體力……"></textarea></div>
        <div class="field"><label for="boundary">先為自己設定的界線</label><textarea id="boundary" placeholder="例如：先體驗兩次，不急著買長期課程"></textarea></div>
      </div>
      <div class="field"><label for="nextStep">最小的下一步</label><textarea id="nextStep" placeholder="下一步我只需要……"></textarea></div>
      <div class="field"><label for="goal">這個階段的完成標準（可選）</label><input id="goal" maxlength="180" placeholder="例如：體驗兩位教練後再決定"></div>
      <div class="form-actions"><button type="submit" id="saveBtn">保存這張決策卡</button><button type="button" class="secondary" id="clearForm">清空表單</button><button type="button" class="ghost" id="cancelEdit" hidden>取消編輯</button></div>
    </form>
  </section>
  <section class="panel" id="panel-history">
    <div class="section-head"><div><h2>我的探索紀錄</h2><p>不只記得結果，也記得自己怎麼走到這裡。</p></div></div>
    <div class="search-row"><input id="historySearch" placeholder="搜尋過去的紀錄…"><select id="historyType" style="max-width:180px"><option value="all">所有紀錄類型</option><option value="進度">進度</option><option value="暫停">暫停</option><option value="重新開始">重新開始</option><option value="分類調整">分類調整</option><option value="完成">完成</option><option value="建立">建立</option></select></div>
    <div id="historyList" class="history-list"></div>
  </section>
</main>
<footer>慢慢探索，不必一次決定一生。　♡</footer>
<div class="toast" id="toast" role="status"></div>

<dialog id="actionDialog">
  <div class="modal-head"><h3 id="actionTitle">記錄進度</h3><button class="ghost small" type="button" id="closeDialog">關閉</button></div>
  <form id="actionForm">
    <div class="modal-body">
      <input type="hidden" id="actionId"><input type="hidden" id="actionType">
      <div class="field" id="actionCategoryWrap" hidden><label for="actionCategory">移到哪個區域？</label><select id="actionCategory"><option>深耕區</option><option>探索區</option><option>收藏區</option></select></div>
      <div class="field"><label for="actionText" id="actionLabel">這次完成了什麼？</label><textarea id="actionText" placeholder="寫下這次的進度、感受或重新開始的第一步……"></textarea></div>
    </div>
    <div class="modal-foot"><button type="button" class="secondary" id="cancelAction">取消</button><button type="submit">保存紀錄</button></div>
  </form>
</dialog>
<script>
(() => {
  const KEY='passionCabin.v1';
  let state={items:[],logs:[]};
  const $=id=>document.getElementById(id);
  const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const now=()=>new Date().toISOString();
  const dateLabel=s=>{try{return new Date(s).toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch{return s||''}};
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('儲存失敗，請匯出備份或檢查瀏覽器儲存空間。');}}
  function load(){try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&Array.isArray(parsed.items)&&Array.isArray(parsed.logs))state=parsed;}}catch(e){state={items:[],logs:[]};}}
  function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600);}
  function addLog(item,type,text=''){state.logs.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),itemId:item.id,itemName:item.name,type,text,createdAt:now()});}
  function switchTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab));if(tab==='home')renderHome();if(tab==='history')renderHistory();window.scrollTo({top:0,behavior:'smooth'});}
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  $('newBtn').onclick=()=>{resetForm();switchTab('new');$('name').focus();};
  function renderStats(){
    const active=state.items.filter(i=>!i.status||i.status==='進行中');
    const count=cat=>active.filter(i=>i.category===cat).length;
    $('stats').innerHTML=[
      ['🌿',count('深耕區'),'正在深耕'],
      ['🧭',count('探索區'),'探索中的興趣'],
      ['🌙',count('收藏區'),'暫時收藏'],
      ['✦',state.logs.length,'留下的探索紀錄']
    ].map(([icon,num,label])=>`<div class="stat"><div>${icon}</div><div class="num">${num}</div><div class="label">${label}</div></div>`).join('');
  }
  function renderHome(){
    renderStats();
    const q=$('search').value.trim().toLowerCase(),filter=$('filter').value;
    const items=state.items.filter(i=>{
      const hay=[i.name,i.appeal,i.doubts,i.cost,i.boundary,i.nextStep,i.goal,...state.logs.filter(l=>l.itemId===i.id).map(l=>l.text)].join(' ').toLowerCase();
      const status=i.status==='暫停'?'已暫停':i.status==='已完成'?'已完成':i.category;
      return (!q||hay.includes(q))&&(filter==='all'||status===filter);
    }).sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt));
    if(!items.length){$('interestGrid').innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="big">🌷</div><strong>${state.items.length?'沒有找到符合條件的興趣':'你的興趣花園還是空的'}</strong><p>${state.items.length?'試試其他關鍵字或分類。':'先記下一件最近讓你心動的事吧。'}</p>${state.items.length?'':'<button id="emptyAdd">新增第一個興趣</button>'}</div>`;const b=$('emptyAdd');if(b)b.onclick=$('newBtn').onclick;return;}
    $('interestGrid').innerHTML=items.map(i=>{
      const status=i.status||'進行中';const pill=status==='暫停'?'paused':status==='已完成'?'done':i.category==='深耕區'?'deep':i.category==='探索區'?'explore':'collect';
      const last=state.logs.find(l=>l.itemId===i.id);
      return `<article class="interest-card"><div class="card-top"><span class="emoji">${escapeHtml(i.emoji||'🌱')}</span><span class="pill ${pill}">${escapeHtml(status==='進行中'?i.category:status)}</span></div><h3>${escapeHtml(i.name)}</h3><div class="muted">${escapeHtml(i.goal||i.appeal||'先探索，不急著定義。')}</div>${i.nextStep?`<div><span class="muted">下一步：</span>${escapeHtml(i.nextStep)}</div>`:''}<div class="muted">最近更新：${dateLabel(i.updatedAt||i.createdAt).split(' ')[0]}</div><div class="card-actions"><button class="small" data-action="progress" data-id="${i.id}">＋進度</button><button class="small secondary" data-action="edit" data-id="${i.id}">編輯</button><button class="small ghost" data-action="more" data-id="${i.id}">更多</button></div></article>`;
    }).join('');
    $('interestGrid').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const i=state.items.find(x=>x.id===b.dataset.id);if(!i)return;if(b.dataset.action==='edit')editItem(i);else if(b.dataset.action==='progress')openAction(i,'進度');else showMore(i);}));
  }
  function resetForm(){ $('interestForm').reset();$('editId').value='';$('formTitle').textContent='熱情決策卡';$('saveBtn').textContent='保存這張決策卡';$('cancelEdit').hidden=true;$('emoji').value='🌱'; }
  $('clearForm').onclick=resetForm;$('cancelEdit').onclick=()=>{resetForm();switchTab('home');};
  function editItem(i){$('editId').value=i.id;['name','category','emoji','appeal','doubts','cost','boundary','nextStep','goal'].forEach(k=>$(k).value=i[k]|| (k==='emoji'?'🌱':k==='category'?'探索區':''));$('formTitle').textContent='編輯熱情決策卡';$('saveBtn').textContent='保存修改';$('cancelEdit').hidden=false;switchTab('new');}
  $('interestForm').addEventListener('submit',e=>{
    e.preventDefault();const id=$('editId').value;const data={name:$('name').value.trim(),category:$('category').value,emoji:$('emoji').value,appeal:$('appeal').value.trim(),doubts:$('doubts').value.trim(),cost:$('cost').value.trim(),boundary:$('boundary').value.trim(),nextStep:$('nextStep').value.trim(),goal:$('goal').value.trim(),updatedAt:now()};
    if(!data.name){toast('先為這份興趣取個名字吧。');return;}
    if(id){const i=state.items.find(x=>x.id===id);if(i){const oldCat=i.category;Object.assign(i,data);if(oldCat!==i.category)addLog(i,'分類調整',`從「${oldCat}」移到「${i.category}」`);else addLog(i,'更新決策卡','更新了興趣的想法或下一步。');}toast('決策卡已更新。');}
    else{const i={...data,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),createdAt:now(),status:'進行中'};state.items.unshift(i);addLog(i,'建立','建立了這份熱情決策卡。');toast('已把這份熱情好好收下。');}
    save();resetForm();switchTab('home');
  });
  $('search').addEventListener('input',renderHome);$('filter').addEventListener('change',renderHome);
  function openAction(i,type){
    $('actionId').value=i.id;$('actionType').value=type;$('actionText').value='';$('actionCategoryWrap').hidden=type!=='分類調整';$('actionCategory').value=i.category||'探索區';
    const labels={進度:['記錄一個進度','這次完成了什麼？','例如：完成一幅肌理畫、上完第一堂體驗課……'],暫停:['暫停這個興趣','為什麼想暫停？','可以寫下原因，或未來想重新開始的提示。'],重新開始:['重新開始','這次想怎麼重新開始？','從一個小步驟開始就好……'],完成:['完成一個階段','這次完成了什麼？','記錄值得被看見的成果。'],分類調整:['調整興趣分類','補充一點想法（可選）','為什麼想調整到這個區域？']};
    const [title,label,placeholder]=labels[type]||labels.進度;$('actionTitle').textContent=title;$('actionLabel').textContent=label;$('actionText').placeholder=placeholder;$('actionDialog').showModal();
  }
  $('closeDialog').onclick=$('cancelAction').onclick=()=>$('actionDialog').close();
  $('actionForm').addEventListener('submit',e=>{
    e.preventDefault();const i=state.items.find(x=>x.id===$('actionId').value);if(!i)return;const type=$('actionType').value,text=$('actionText').value.trim();
    if(type==='暫停')i.status='暫停';
    if(type==='重新開始')i.status='進行中';
    if(type==='完成')i.status='已完成';
    if(type==='分類調整'){const old=i.category;i.category=$('actionCategory').value;if(old!==i.category)addLog(i,'分類調整',`從「${old}」移到「${i.category}」${text?'：'+text:''}`);else addLog(i,type,text||'保持原分類。');}
    else addLog(i,type,text||({暫停:'先讓這個興趣休息一下。',重新開始:'重新把這個興趣帶回生活。',完成:'完成了一個階段。'}[type]||'記下一個小進度。'));
    i.updatedAt=now();save();$('actionDialog').close();renderHome();renderHistory();toast('探索紀錄已保存。');
  });
  function showMore(i){
    const dlg=$('actionDialog');$('actionId').value=i.id;$('actionText').value='';$('actionCategoryWrap').hidden=true;
    $('actionTitle').textContent=i.name;$('actionLabel').textContent='選擇下一步';$('actionText').placeholder='如果你選擇暫停或完成，可以補充原因。';
    const body=dlg.querySelector('.modal-body');
    body.innerHTML=`<input type="hidden" id="actionId" value="${i.id}"><input type="hidden" id="actionType"><div class="field"><label>這份興趣目前的狀態</label><p>${escapeHtml(i.status||'進行中')} · ${escapeHtml(i.category)}</p></div><div class="field"><label>補充說明（可選）</label><textarea id="actionText" placeholder="寫下原因或想留給未來自己的話……"></textarea></div>`;
    const foot=dlg.querySelector('.modal-foot');
    foot.innerHTML=`<button type="button" class="secondary" id="moreCancel">取消</button><button type="button" class="ghost" id="moveBtn">調整分類</button><button type="button" class="secondary" id="pauseBtn">${i.status==='暫停'?'重新開始':'暫停'}</button><button type="button" id="doneBtn">${i.status==='已完成'?'重新開啟':'完成階段'}</button><button type="button" class="danger" id="deleteBtn">刪除</button>`;
    dlg.showModal();
    $('moreCancel').onclick=()=>{dlg.close();restoreDialog();};
    $('moveBtn').onclick=()=>{dlg.close();restoreDialog();openAction(i,'分類調整');};
    $('pauseBtn').onclick=()=>{const txt=$('actionText').value.trim();const typ=i.status==='暫停'?'重新開始':'暫停';i.status=typ==='暫停'?'暫停':'進行中';i.updatedAt=now();addLog(i,typ,txt|| (typ==='暫停'?'先讓這個興趣休息一下。':'重新把這個興趣帶回生活。'));save();dlg.close();restoreDialog();renderHome();renderHistory();toast(typ==='暫停'?'已暫停，這不是放棄。':'歡迎回來，已記錄重新開始。');};
    $('doneBtn').onclick=()=>{const txt=$('actionText').value.trim();if(i.status==='已完成'){i.status='進行中';addLog(i,'重新開始',txt||'重新開啟這個興趣。');}else{i.status='已完成';addLog(i,'完成',txt||'完成了一個階段，值得好好慶祝。');}i.updatedAt=now();save();dlg.close();restoreDialog();renderHome();renderHistory();toast('已更新興趣狀態。');};
    $('deleteBtn').onclick=()=>{if(confirm(`確定刪除「${i.name}」與它的相關紀錄嗎？此操作無法復原。`)){state.items=state.items.filter(x=>x.id!==i.id);state.logs=state.logs.filter(l=>l.itemId!==i.id);save();dlg.close();restoreDialog();renderHome();renderHistory();toast('已刪除這份興趣。');}};
  }
  function restoreDialog(){
    const dlg=$('actionDialog');
    dlg.querySelector('.modal-body').innerHTML=`<input type="hidden" id="actionId"><input type="hidden" id="actionType"><div class="field" id="actionCategoryWrap" hidden><label for="actionCategory">移到哪個區域？</label><select id="actionCategory"><option>深耕區</option><option>探索區</option><option>收藏區</option></select></div><div class="field"><label for="actionText" id="actionLabel">這次完成了什麼？</label><textarea id="actionText" placeholder="寫下這次的進度、感受或重新開始的第一步……"></textarea></div>`;
    dlg.querySelector('.modal-foot').innerHTML=`<button type="button" class="secondary" id="cancelAction">取消</button><button type="submit" form="actionForm">保存紀錄</button>`;
    $('cancelAction').onclick=()=>dlg.close();
  }
  function renderHistory(){
    const q=$('historySearch').value.trim().toLowerCase(),type=$('historyType').value;
    const logs=state.logs.filter(l=>(!q||[l.itemName,l.type,l.text].join(' ').toLowerCase().includes(q))&&(type==='all'||l.type===type));
    if(!logs.length){$('historyList').innerHTML='<div class="empty"><div class="big">📖</div><strong>這裡會慢慢長出你的探索故事</strong><p>新增興趣、記錄進度或暫停時，紀錄就會出現在這裡。</p></div>';return;}
    const icons={建立:'🌱',進度:'✦',暫停:'☁️',重新開始:'🌿',完成:'🏵️',分類調整:'🧭',更新決策卡:'📝'};
    $('historyList').innerHTML=logs.map(l=>`<article class="history-item"><div class="history-dot">${icons[l.type]||'♡'}</div><div><div class="history-date">${dateLabel(l.createdAt)} · ${escapeHtml(l.type)}</div><h4>${escapeHtml(l.itemName||'未命名興趣')}</h4><p>${escapeHtml(l.text||'')}</p></div></article>`).join('');
  }
  $('historySearch').addEventListener('input',renderHistory);$('historyType').addEventListener('change',renderHistory);
  $('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({...state,exportedAt:now(),app:'熱情管理小屋'},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`熱情管理小屋備份-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);toast('備份檔已匯出。');};
  $('importBtn').onclick=()=>$('importFile').click();
  $('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.items)||!Array.isArray(data.logs))throw new Error('格式不符');if(!confirm(`備份內有 ${data.items.length} 個興趣、${data.logs.length} 筆紀錄。匯入會取代目前資料，建議先匯出現有備份。要繼續嗎？`))return;state={items:data.items,logs:data.logs};save();renderHome();renderHistory();toast('備份已匯入。');}catch(err){alert('無法讀取這個備份檔，請選擇由熱情管理小屋匯出的 JSON 檔。');}finally{e.target.value='';}};
  load();renderHome();renderHistory();
})();
</script>

<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
